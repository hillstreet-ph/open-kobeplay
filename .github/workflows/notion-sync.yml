name: Notion metadata sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notion-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: notion-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate redacted metadata snapshot
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/sync-notion.mjs
      - name: Detect material changes
        id: changes
        run: |
          git diff --ignore-matching-lines='"generated_at"' --quiet -- generated/notion/manifest.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create review pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/notion-metadata-sync
          delete-branch: true
          commit-message: "chore: sync Notion metadata"
          title: "chore: sync Notion metadata"
          body: |
            Automated metadata-only snapshot from canonical Notion IDs.

            No page bodies, credentials, payment data, private conversations, or secrets are exported.
          labels: automation,notion-sync
